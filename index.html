<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<script>
  // Before first paint: the theme chosen in Account (dark by default). Mirrors lib/theme.js.
  try {
    var t = localStorage.getItem('theme')
    if (t === 'auto') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
    if (t === 'light') { document.documentElement.dataset.theme = 'light'; document.querySelector('meta[name=theme-color]').content = '#f1f2ef' }
  } catch (e) {}
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Circle">
<meta name="application-name" content="Circle">
<title>Circle</title>
<link rel="preload" href="/fonts/material-symbols-rounded.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/iranyekan-regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/iranyekan-bold.woff2" as="font" type="font/woff2" crossorigin>

<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>

</html>
